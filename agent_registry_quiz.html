const questions = [{"id": 100, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #13 | M2S2 Slide 15", "q": "What is Google Cloud Agent Registry?", "options": ["A centralized catalog that lets you store, discover, and govern MCP servers, tools, standalone skills, and AI agents within Google Cloud", "A managed serverless container runtime that replaces Cloud Run for ADK agents", "A foundation model weight repository that replaces Vertex AI Model Registry", "An API gateway that terminates mTLS and bills token usage"], "answer": 0, "why": "Verbatim doc definition (§1.4): Agent Registry is 'a centralized catalog that lets you store, discover, and govern MCP servers, tools, standalone skills, and AI agents within Google Cloud.' It is not a runtime or model registry."}, {"id": 101, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Self-Test #3 & Trigger #13 | M2S2 Slide 15", "q": "What are the three official goals of Google Cloud Agent Registry?", "options": ["Accelerate development, simplify integration, and support governance", "Host containers, fine-tune foundation models, and manage token billing", "Replace Cloud IAM, encrypt VPC traffic, and redact PII", "Auto-scale runtimes, cache prompts, and provision throughput"], "answer": 0, "why": "Agent Registry's three goals (§1.4) are: (1) Accelerate development (discovery and reuse), (2) Simplify integration (standardized MCP and A2A protocols), and (3) Support governance (enforce security and boundaries across the agentic fleet)."}, {"id": 102, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #14 | M2S2 Slide 16", "q": "A team deploys agents across Google Cloud. Which deployment requires MANUAL registration in Agent Registry via a writable Service resource?", "options": ["An ADK A2A agent deployed on Cloud Run", "An agent deployed on Agent Runtime (Gemini Enterprise Agent Platform)", "A GKE deployment configured with Agent Registry annotations", "An official Google Cloud remote MCP server"], "answer": 0, "why": "Auto-registration covers supported Google Cloud runtimes once the API is enabled (Agent Runtime, Workspace/Gemini Enterprise, annotated GKE, and official Google remote MCP servers). Cloud Run agents are NOT auto-discovered and require manual registration via the writable Service resource."}, {"id": 103, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Self-Test #3 & Trigger #14 | M2S2 Slide 20", "q": "When manually registering or updating an item in Agent Registry, which resource is WRITABLE versus READ-ONLY?", "options": ["Service is writable; Agent, McpServer, and Endpoint are read-only", "Agent and McpServer are writable; Service is read-only", "Endpoint is writable; Service and Agent are read-only", "All resources (Service, Agent, McpServer, Endpoint) are directly writable"], "answer": 0, "why": "Everything registered manually is written through the writable 'Service' resource, and then queried through the read-only 'Agent', 'McpServer', and 'Endpoint' resources."}, {"id": 104, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #13 (Swapped-Definition Trap) | M2S2 Slide 18", "q": "A security engineer wants to grant an agent IAM permission to query BigQuery. Should they use the Agent Identifier or the Agent Principal?", "options": ["Agent Principal (principal://...), because Agent Identifier (urn:agent:...) is only a logical catalog name and is never used in IAM bindings", "Agent Identifier (urn:agent:...), because it is the primary IAM identity for all registered agents", "Either one, because Identifier and Principal are interchangeable in IAM bindings", "Neither, because agents can never hold an IAM identity for Google Cloud resources"], "answer": 0, "why": "Agent Identifier (urn:agent:...) is a logical catalog ID used for inventory and lookup—never in IAM bindings. Agent Principal (principal://...) is the SPIFFE/service-account IAM identity used for permissions and auditing."}, {"id": 105, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #13 | M2S2 Slide 19", "q": "How do A2A skills differ from standalone skills in Agent Registry?", "options": ["A2A skills are declarative metadata inline in an Agent Card; standalone skills are separate resources managed via Skill, SkillRevision, and Publisher", "A2A skills are top-level GCP resources; standalone skills only exist inline inside an Agent Card", "A2A skills are for MCP servers only; standalone skills are for Cloud Run only", "There is no difference; both are stored exclusively inside an Agent Card"], "answer": 0, "why": "A2A skills are declarative metadata declared inline in an agent's Agent Card. Standalone skills are separate catalog resources managed, versioned, and listed through the Skill, SkillRevision, and Publisher resources."}, {"id": 106, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #13 | M2S2 Slide 17", "q": "An orchestrator uses the Agent Registry MCP server to find agents by natural-language keyword. Which tool should it call?", "options": ["search_agents (while list_agents enumerates by project/location, and search_mcp_servers covers MCP servers only)", "search_mcp_servers, which searches both agents and MCP servers", "list_agents, which performs natural-language semantic search across all projects", "find_endpoints, which searches agents, tools, and skills together"], "answer": 0, "why": "The Registry MCP server provides 'list_agents' for enumerating agents by project and location, 'search_agents' for keyword/prefix/natural-language discovery of agents, and 'search_mcp_servers' for MCP servers only."}, {"id": 107, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Tab 2 M2S2 Slide 16", "q": "What is the correct four-stage operating sequence in Agent Registry?", "options": ["Register → Discover → Govern → Orchestrate", "Discover → Register → Orchestrate → Govern", "Govern → Register → Discover → Orchestrate", "Register → Orchestrate → Discover → Govern"], "answer": 0, "why": "The four-stage lifecycle in Agent Registry is Register → Discover → Govern → Orchestrate."}, {"id": 108, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Tab 2 M2S2 Slide 20", "q": "In Agent Registry, what is the difference between a Tool and an Endpoint?", "options": ["Tools are deterministic functions served by MCP servers; Endpoints are target URLs (such as REST APIs) governed in the registry", "Endpoints are deterministic functions on MCP servers; Tools are legacy REST URLs", "Tools and Endpoints are two names for the exact same MCP resource", "Endpoints are only for Gemini Enterprise, while Tools are only for Cloud Run"], "answer": 0, "why": "Tools represent callable functions exposed by MCP servers, while Endpoints represent target network URLs/APIs registered for discovery and governance."}, {"id": 109, "topicId": "agent_registry", "topic": "Agent Registry", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.4 Agent Registry | Trigger #14 | M2S2 Slide 16", "q": "A developer publishes a Cloud Run agent to a Gemini Enterprise app, but it does not appear in Agent Registry. Why?", "options": ["Gemini Enterprise and Agent Registry are separate catalogs that don't auto-sync for Cloud Run, so the Cloud Run agent must be registered manually via a Service resource", "Agent Registry takes 24 hours to sync asynchronously from Gemini Enterprise", "Cloud Run agents are blocked from being added to Agent Registry under any configuration", "Agent Registry only stores MCP servers, never AI agents"], "answer": 0, "why": "Cloud Run agents are not automatically discovered by Agent Registry and must be manually registered through the writable Service resource."}];
const STORAGE_KEY = "project_elevate_unified_mistakes_v1";
const LOCAL_API_URL = "http://127.0.0.1:8765/api/mistakes";

let activePool = [];
let current = 0;
let score = 0;
let criticalFirst = true;
let sessionMistakes = [];
let mistakesMap = {};

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) mistakesMap = JSON.parse(raw);
  } catch (e) {}
}
function saveMistakes(item, wrongChoice) {
  loadMistakes();
  const ex = mistakesMap[item.id];
  mistakesMap[item.id] = {
    ...item,
    yours: wrongChoice,
    correct: item.options[item.answer],
    missCount: ex ? (ex.missCount || 1) + 1 : 1,
    lastMissed: new Date().toLocaleDateString()
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakesMap)); } catch (e) {}
  fetch(LOCAL_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), questions: Object.values(mistakesMap) })
  }).catch(() => {});
}
function shuffle(a) {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function renderNav() {
  return `<div class="topic-nav">
    <a class="topic-link hub" href="index.html">🏠 Hub & Mock Exams</a>
    ${ALL_TOPICS.map(t => `<a class="topic-link ${t.id === TOPIC_META.id ? 'active' : ''}" href="${t.quizFile}">${t.icon} ${t.shortTitle}</a>`).join("")}
  </div>`;
}
function start(orderCrit = true) {
  criticalFirst = orderCrit;
  const crit = shuffle(questions.filter(q => q.priority === "CRITICAL"));
  const high = shuffle(questions.filter(q => q.priority !== "CRITICAL"));
  activePool = criticalFirst ? [...crit, ...high] : shuffle(questions);
  current = 0; score = 0; sessionMistakes = [];
  show();
}
function show() {
  const item = activePool[current];
  const opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <div class="header-row">
      <h1>${TOPIC_META.icon} ${TOPIC_META.title} (10 Questions)</h1>
      <div>
        ${TOPIC_META.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL TOPIC</span>' : '<span class="badge badge-high">⚡ HIGH VALUE TOPIC</span>'}
        <span class="badge badge-mod">${TOPIC_META.examWeight}</span>
      </div>
    </div>
    <div class="doc-ref">📖 <b>Doc Reference:</b> ${item.docRef}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#475569;">
      <span>Question <b>${current + 1} of ${activePool.length}</b> &nbsp;|&nbsp; Score: <b>${score}</b></span>
      <div>
        ${item.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL — Practice First</span>' : '<span class="badge badge-high">⚡ HIGH VALUE</span>'}
        <button class="btn secondary" style="margin:0 0 0 8px;padding:4px 10px;font-size:12px;" onclick="start(${!criticalFirst})">
          ${criticalFirst ? "🔀 Shuffle All" : "🔥 Order Critical First"}
        </button>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${((current + 1) / activePool.length) * 100}%"></div></div>
    <div class="q">${item.q}</div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div id="next"></div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => pick(b, o, opts, item);
    box.appendChild(b);
  });
}
function pick(btn, chosen, opts, item) {
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].right) b.classList.add("correct");
  });
  if (chosen.right) {
    score++;
  } else {
    btn.classList.add("wrong");
    sessionMistakes.push({ item, yours: chosen.t, correct: item.options[item.answer] });
    saveMistakes(item, chosen.t);
  }
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = (chosen.right ? "<b>✅ Correct!</b> " : "<b>❌ Incorrect (Saved to Wrong Answers Bank).</b> ") + item.why + `<br><small style="color:#64748b;font-family:monospace;">📌 ${item.docRef}</small>`;
  const last = current === activePool.length - 1;
  document.getElementById("next").innerHTML = `<button class="btn" onclick="${last ? 'finish()' : 'nextQ()'}">${last ? 'See Results' : 'Next Question →'}</button>`;
}
function nextQ() { current++; show(); }
function finish() {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <h1>${TOPIC_META.icon} ${TOPIC_META.title} — Results: ${score} / ${activePool.length}</h1>
    <p>${score >= 9 ? "✅ Passed (≥90%)! Ready for the next topic." : "⚠️ Below 9/10 pass bar. Review the missed questions below and retake."}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="btn" onclick="start(true)">🔄 Retake (Critical First)</button>
      <a class="btn secondary" href="index.html">🏠 Back to Full Hub & Mock Exams</a>
    </div>
    ${sessionMistakes.map(m => `
      <div class="explain" style="display:block;border-left-color:#dc2626;margin-bottom:10px;">
        <b>${m.item.q}</b><br>
        <span style="color:#dc2626;">Your answer:</span> ${m.yours}<br>
        <span style="color:#15803d;">Correct:</span> ${m.correct}<br>
        ${m.item.why}<br>
        <small style="font-family:monospace;color:#64748b;">📖 ${m.item.docRef}</small>
      </div>
    `).join("")}
  `;
}
loadMistakes();
