VALUE", "rankNote": "Caching Billing, PT Limits & SharePoint ACLs", "docSection": "Elevate Capstone Prep (Oct 7-8).md — §1.9, §1.10, §6.2, §6.6 & §5 Triggers #9, #10, #20, #22", "slideRef": "M1L5 Slides 3, 17–26; M1L6 Slides 6–16; M3L4 Slide 14; M3L5 Slides 14–19", "summary": "Standard input price for cache creation, Explicit TTL storage vs free Implicit storage, 2,048 vs 4,096 min tokens, PT exclusions, Semantic Routing, GE Federated 2nd sign-in, BigQuery ObjectRef, AWS migration.", "quizFile": "gemini_finops_enterprise_quiz.html"}];
const questions = [{"id": 0, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Trigger #12 | M2S2 Slide 42", "q": "A platform team wants every Model Armor template in the company to at least enable prompt-injection detection, while teams can still add stricter filters. What should they use?", "options": ["Floor settings, which set minimum requirements at the org, folder, or project level that templates can't go below", "One shared 'golden' template that every team must voluntarily reference", "A confidence level of LOW_AND_ABOVE enforced via IAM Conditions", "An IAM deny policy on the Model Armor API"], "answer": 0, "why": "Floor settings define minimum enforcement requirements at the organization, folder, or project level. Teams can configure stricter filters on their templates, but cannot create a template less strict than the floor."}, {"id": 1, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Trigger #12 | M2S2 Slide 44", "q": "A customer complains that Model Armor blocks too many legitimate prompts. Which confidence level gives the FEWEST false positives?", "options": ["HIGH (flags only high-likelihood violations, minimizing false positives)", "LOW_AND_ABOVE (strictest setting, flags low, medium, and high)", "MEDIUM_AND_ABOVE", "Confidence level does not affect false-positive rates"], "answer": 0, "why": "HIGH flags only high-confidence violations, resulting in the fewest false positives. LOW_AND_ABOVE is the strictest threshold and produces the most false positives."}, {"id": 2, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Self-Test #5 & Trigger #12 | M2S2 Slide 49", "q": "What is the recommended rollout sequence for a new Model Armor deployment?", "options": ["Start in Inspect only, tune with test data, production monitoring, and user feedback, then switch to Inspect and block", "Deploy straight to Inspect and block from day one, then relax filters if users complain", "Keep Inspect only permanently, because blocking breaks LLM applications", "Use Inspect and block for prompts and Inspect only for responses permanently"], "answer": 0, "why": "Official best practice: start in Inspect only (logs findings without blocking), tune thresholds using test data, production telemetry, and feedback, and then switch to Inspect and block."}, {"id": 3, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Trigger #12 (Swapped-Definition Trap) | M2S2 Slide 46", "q": "A healthcare customer needs credit card numbers REDACTED or tokenized before prompts reach the model. What configuration do they need?", "options": ["Advanced Sensitive Data Protection (SDP) configuration with an inspect template (required) and a de-identify template (optional)", "Basic Sensitive Data Protection configuration (which automatically redacts US infoTypes)", "The prompt-injection and jailbreak filter set to HIGH", "A Responsible AI filter for 'dangerous content'"], "answer": 0, "why": "Basic SDP uses a fixed set of predefined (mostly US) infoTypes and ONLY flags findings. Redaction or tokenization requires Advanced SDP with your own SDP inspect template (required) and de-identify template."}, {"id": 4, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Self-Test #5 & Trigger #12 | M2S2 Slide 48", "q": "A user uploads a 6 MB document for screening. What does Model Armor do?", "options": ["Skips it (it isn't blocked), and the skipped data isn't billed", "Blocks the file immediately because it exceeds the 4 MB limit", "Compresses the file s URL detection scan?", "options": ["The first 40 URLs", "All 60 URLs", "The first 10 URLs", "None; URLs are only scanned in model responses"], "answer": 0, "why": "Model Armor's malicious URL detection scans up to the first 40 URLs per input."}, {"id": 8, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | Trigger #12 | M2S2 Slides 49–50", "q": "A CE is configuring Model Armor for a customer for the first time. Which starting configuration matches Google's recommended phased strategy?", "options": ["Responsible AI filters at HIGH, prompt injection at MEDIUM (or HIGH for Gemini Enterprise), advanced SDP templates, in Inspect only mode", "Responsible AI at LOW_AND_ABOVE, prompt injection at HIGH, basic SDP, in Inspect and block mode", "All filters at LOW_AND_ABOVE with Inspect and block enabled on day one", "Responsible AI disabled, CSAM disabled, and Inspect only mode"], "answer": 0, "why": "Start in Inspect only with Responsible AI at HIGH (fewest false positives), prompt injection/jailbreak at MEDIUM (or HIGH for Gemini Enterprise), and advanced SDP templates before moving to Inspect and block."}, {"id": 9, "topicId": "model_armor", "topic": "Model Armor", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.7 Model Armor | M2S2 Slide 48", "q": "Which statement about Model Armor IMAGE screening (Preview) is accurate?", "options": ["Supports JPEG, PNG, and BMP only, up to 4 MB, one image per request, in US and EU multi-regions (using OCR)", "Supports any image format up to 20 MB across all global regions", "Scans up to 10 images per request for batch throughput", "Only inspects EXIF image metadata, not visual text content"], "answer": 0, "why": "Model Armor image screening supports JPEG, PNG, and BMP formats only, up to 4 MB, a single image per request, in US and EU multi-regions, extracting text via OCR."}];
const STORAGE_KEY = "project_elevate_unified_mistakes_v1";
const LOCAL_API_URL = "http://127.0.0.1:8765/api/mistakes";

let activePool = [];
let current = 0;
let score = 0;
let criticalFirst = true;
let sessionMistakes = [];
let mistakesMap = {};

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) mistakesMap = JSON.parse(raw);
  } catch (e) {}
}
function saveMistakes(item, wrongChoice) {
  loadMistakes();
  const ex = mistakesMap[item.id];
  mistakesMap[item.id] = {
    ...item,
    yours: wrongChoice,
    correct: item.options[item.answer],
    missCount: ex ? (ex.missCount || 1) + 1 : 1,
    lastMissed: new Date().toLocaleDateString()
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakesMap)); } catch (e) {}
  fetch(LOCAL_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), questions: Object.values(mistakesMap) })
  }).catch(() => {});
}
function shuffle(a) {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function renderNav() {
  return `<div class="topic-nav">
    <a class="topic-link hub" href="index.html">🏠 Hub & Mock Exams</a>
    ${ALL_TOPICS.map(t => `<a class="topic-link ${t.id === TOPIC_META.id ? 'active' : ''}" href="${t.quizFile}">${t.icon} ${t.shortTitle}</a>`).join("")}
  </div>`;
}
function start(orderCrit = true) {
  criticalFirst = orderCrit;
  const crit = shuffle(questions.filter(q => q.priority === "CRITICAL"));
  const high = shuffle(questions.filter(q => q.priority !== "CRITICAL"));
  activePool = criticalFirst ? [...crit, ...high] : shuffle(questions);
  current = 0; score = 0; sessionMistakes = [];
  show();
}
function show() {
  const item = activePool[current];
  const opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <div class="header-row">
      <h1>${TOPIC_META.icon} ${TOPIC_META.title} (10 Questions)</h1>
      <div>
        ${TOPIC_META.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL TOPIC</span>' : '<span class="badge badge-high">⚡ HIGH VALUE TOPIC</span>'}
        <span class="badge badge-mod">${TOPIC_META.examWeight}</span>
      </div>
    </div>
    <div class="doc-ref">📖 <b>Doc Reference:</b> ${item.docRef}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#475569;">
      <span>Question <b>${current + 1} of ${activePool.length}</b> &nbsp;|&nbsp; Score: <b>${score}</b></span>
      <div>
        ${item.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL — Practice First</span>' : '<span class="badge badge-high">⚡ HIGH VALUE</span>'}
        <button class="btn secondary" style="margin:0 0 0 8px;padding:4px 10px;font-size:12px;" onclick="start(${!criticalFirst})">
          ${criticalFirst ? "🔀 Shuffle All" : "🔥 Order Critical First"}
        </button>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${((current + 1) / activePool.length) * 100}%"></div></div>
    <div class="q">${item.q}</div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div id="next"></div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => pick(b, o, opts, item);
    box.appendChild(b);
  });
}
function pick(btn, chosen, opts, item) {
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].right) b.classList.add("correct");
  });
  if (chosen.right) {
    score++;
  } else {
    btn.classList.add("wrong");
    sessionMistakes.push({ item, yours: chosen.t, correct: item.options[item.answer] });
    saveMistakes(item, chosen.t);
  }
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = (chosen.right ? "<b>✅ Correct!</b> " : "<b>❌ Incorrect (Saved to Wrong Answers Bank).</b> ") + item.why + `<br><small style="color:#64748b;font-family:monospace;">📌 ${item.docRef}</small>`;
  const last = current === activePool.length - 1;
  document.getElementById("next").innerHTML = `<button class="btn" onclick="${last ? 'finish()' : 'nextQ()'}">${last ? 'See Results' : 'Next Question →'}</button>`;
}
function nextQ() { current++; show(); }
function finish() {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <h1>${TOPIC_META.icon} ${TOPIC_META.title} — Results: ${score} / ${activePool.length}</h1>
    <p>${score >= 9 ? "✅ Passed (≥90%)! Ready for the next topic." : "⚠️ Below 9/10 pass bar. Review the missed questions below and retake."}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="btn" onclick="start(true)">🔄 Retake (Critical First)</button>
      <a class="btn secondary" href="index.html">🏠 Back to Full Hub & Mock Exams</a>
    </div>
    ${sessionMistakes.map(m => `
      <div class="explain" style="display:block;border-left-color:#dc2626;margin-bottom:10px;">
        <b>${m.item.q}</b><br>
        <span style="color:#dc2626;">Your answer:</span> ${m.yours}<br>
        <span style="color:#15803d;">Correct:</span> ${m.correct}<br>
        ${m.item.why}<br>
        <small style="font-family:monospace;color:#64748b;">📖 ${m.item.docRef}</small>
      </div>
    `).join("")}
  `;
}
loadMistakes();
start(true);
</script>
