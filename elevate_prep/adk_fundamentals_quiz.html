const questions = [{"id": 400, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Self-Test #2 & Trigger #3 | M0L7 Slides 10–12", "q": "How do ADK workflow agents (SequentialAgent, ParallelAgent, LoopAgent) orchestrate their sub-agents?", "options": ["Using predefined deterministic logic without consulting an AI model to orchestrate (while sub-agents can still be LLM agents and call tools)", "By calling an LLM router before every step to decide which sub-agent runs next", "By prohibiting sub-agents from using an LLM or calling any tools", "By converting all sub-agents into static SQL queries"], "answer": 0, "why": "Workflow agents (SequentialAgent, ParallelAgent, LoopAgent) run sub-agents using predefined logic (in order, concurrently, or repeated) without consulting an AI model to orchestrate. Sub-agents can still be LLM agents and call tools."}, {"id": 401, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M0", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #2 | M0L7 Slide 25", "q": "A team is building a pipeline where three steps always run in the exact same order and no model is needed to decide the route. Which design pattern should they choose?", "options": ["A deterministic workflow pattern (such as SequentialAgent)", "An LLM coordinator pattern, because every routing decision requires a model call", "A standalone SkillRevision resource without ADK", "An unauthenticated webhook loop"], "answer": 0, "why": "Google's design guidance (§1.2): if the steps are predefined and no model needs to orchestrate them, use a deterministic workflow pattern. Use agentic patterns (coordinator) only when the model must decide the route."}, {"id": 402, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M0", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #1 | M0L6 Slides 6–7", "q": "When you pass a Python function as an ADK tool, how does ADK build the tool schema that the model sees?", "options": ["From the function's name, docstring, parameters, type hints, and default values", "By reading the full Python function body and inline # comments", "From a hand-written JSON schema file that you must author manually for every tool", "From the function's return statement only"], "answer": 0, "why": "ADK builds the tool schema from the function's name, docstring (becomes description), parameters, type hints, and default values. You never hand-write JSON schemas for function tools."}, {"id": 403, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M0", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #1 | M0L6 Slides 6–7", "q": "In an ADK Python function tool, which parameters are treated as REQUIRED, and what does the model NEVER see?", "options": ["Parameters without default values are required, and the model never sees the function body or # comments", "Parameters with default values are required, and the model reads inline # comments for hints", "All parameters are optional, and the model inspects the entire Python function body", "Only string parameters are required, and the model ignores the docstring"], "answer": 0, "why": "Parameters without default values are marked required in the tool schema; the docstring becomes the tool description; the model never sees the function body or # comments."}, {"id": 404, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #3 | M3L1 Slide 9", "q": "Which node types are supported in an ADK 2.0 graph workflow, and how are parallel branches merged?", "options": ["Functions, human input, Tools, and LLM capabilities (agents), with Join nodes merging parallel branches", "LLM agent nodes only; graphs cannot include plain functions or human input", "Tools and SQL nodes only, merged by a LoopAgent", "Only Model Armor templates and Service resources"], "answer": 0, "why": "ADK 2.0 graphs support four node types: Functions, human input, Tools, and LLM capabilities (agents), and use Join nodes to merge parallel branches."}, {"id": 405, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #3 | M3L1 Slide 9", "q": "In an ADK 2.0 graph, what is the difference between setting data on an Event's 'state' field versus using 'output'?", "options": ["Setting an Event's 'state' field lets any downstream node read it, whereas 'output' passes data only to the immediate next node", "'output' is readable by all downstream nodes, whereas 'state' only reaches the immediate next node", "Both 'state' and 'output' pass data only to the immediate next node", "Neither 'state' nor 'output' can pass data between graph nodes"], "answer": 0, "why": "Nodes set shared state through an Event's 'state' field so any downstream node can read it. 'output' passes data only to the immediate next node."}, {"id": 406, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #5 | M3L1 Slide 10", "q": "Which of the following is NOT a real ADK SessionService implementation (a classic exam distractor)?", "options": ["TextEmbeddingService", "InMemorySessionService", "DatabaseSessionService", "VertexAiSessionService"], "answer": 0, "why": "The three real SessionService implementations are InMemorySessionService, DatabaseSessionService, and VertexAiSessionService. 'TextEmbeddingService' is a classic made-up distractor called out in §1.2."}, {"id": 407, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 ADK Fundamentals | Trigger #5 | M3L1 Slide 10", "q": "What does ADK's SessionService do during a conversation?", "options": ["Loads and saves Session objects (one conversation's state and event history) and applies 'state_delta' from each event", "Generates vector embeddings for PDF files stored in Cloud Storage", "Builds the tool schema from Python docstrings and type hints", "Issues 3-legged OAuth tokens for third-party SaaS applications"], "answer": 0, "why": "SessionService loads and saves Session objects (state and event history) and applies the 'state_delta' from each event."}, {"id": 408, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M0", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.2 & §5 Trigger #2 | M0L7 Slides 15–16", "q": "A parent Coordinator LLM agent fails to delegate tasks to a specialist sub-agent. What is the most likely fix in ADK?", "options": ["Give the sub-agent a clear, specific 'name' and 'description' in Agent(name=..., description=...)", "Rewrite the sub-agent as a C++ binary", "Remove the docstring from all Python function tools", "Switch from VertexAiSessionService to TextEmbeddingService"], "answer": 0, "why": "Per Trigger #2, when an LLM coordinator fails to route to a specialist sub-agent, the sub-agent is missing a clear, specific 'name' and 'description' in Agent(name=..., description=...)."}, {"id": 409, "topicId": "adk_fundamentals", "topic": "ADK 2.0 Fundamentals & Graphs", "module": "M3", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §5 Trigger #17 | M3L1 Slides 14–19", "q": "In ADK's before_tool_callback, what happens when the callback returns None versus returning a dict?", "options": ["Returning None allows normal tool execution; returning a dict blocks/short-circuits the tool and returns that dict to the LLM", "Returning None blocks the tool call; returning a dict allows normal execution", "Returning a dict deletes the current session state", "Both None and dict skip the tool call and terminate the agent"], "answer": 0, "why": "Per Trigger #17: In before_tool_callback, return None to ALLOW normal tool execution; return a dict to BLOCK/SHORT-CIRCUIT the tool and return that dict directly to the LLM."}];
const STORAGE_KEY = "project_elevate_unified_mistakes_v1";
const LOCAL_API_URL = "http://127.0.0.1:8765/api/mistakes";

let activePool = [];
let current = 0;
let score = 0;
let criticalFirst = true;
let sessionMistakes = [];
let mistakesMap = {};

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) mistakesMap = JSON.parse(raw);
  } catch (e) {}
}
function saveMistakes(item, wrongChoice) {
  loadMistakes();
  const ex = mistakesMap[item.id];
  mistakesMap[item.id] = {
    ...item,
    yours: wrongChoice,
    correct: item.options[item.answer],
    missCount: ex ? (ex.missCount || 1) + 1 : 1,
    lastMissed: new Date().toLocaleDateString()
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakesMap)); } catch (e) {}
  fetch(LOCAL_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), questions: Object.values(mistakesMap) })
  }).catch(() => {});
}
function shuffle(a) {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function renderNav() {
  return `<div class="topic-nav">
    <a class="topic-link hub" href="index.html">🏠 Hub & Mock Exams</a>
    ${ALL_TOPICS.map(t => `<a class="topic-link ${t.id === TOPIC_META.id ? 'active' : ''}" href="${t.quizFile}">${t.icon} ${t.shortTitle}</a>`).join("")}
  </div>`;
}
function start(orderCrit = true) {
  criticalFirst = orderCrit;
  const crit = shuffle(questions.filter(q => q.priority === "CRITICAL"));
  const high = shuffle(questions.filter(q => q.priority !== "CRITICAL"));
  activePool = criticalFirst ? [...crit, ...high] : shuffle(questions);
  current = 0; score = 0; sessionMistakes = [];
  show();
}
function show() {
  const item = activePool[current];
  const opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <div class="header-row">
      <h1>${TOPIC_META.icon} ${TOPIC_META.title} (10 Questions)</h1>
      <div>
        ${TOPIC_META.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL TOPIC</span>' : '<span class="badge badge-high">⚡ HIGH VALUE TOPIC</span>'}
        <span class="badge badge-mod">${TOPIC_META.examWeight}</span>
      </div>
    </div>
    <div class="doc-ref">📖 <b>Doc Reference:</b> ${item.docRef}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#475569;">
      <span>Question <b>${current + 1} of ${activePool.length}</b> &nbsp;|&nbsp; Score: <b>${score}</b></span>
      <div>
        ${item.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL — Practice First</span>' : '<span class="badge badge-high">⚡ HIGH VALUE</span>'}
        <button class="btn secondary" style="margin:0 0 0 8px;padding:4px 10px;font-size:12px;" onclick="start(${!criticalFirst})">
          ${criticalFirst ? "🔀 Shuffle All" : "🔥 Order Critical First"}
        </button>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${((current + 1) / activePool.length) * 100}%"></div></div>
    <div class="q">${item.q}</div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div id="next"></div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => pick(b, o, opts, item);
    box.appendChild(b);
  });
}
function pick(btn, chosen, opts, item) {
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].right) b.classList.add("correct");
  });
  if (chosen.right) {
    score++;
  } else {
    btn.classList.add("wrong");
    sessionMistakes.push({ item, yours: chosen.t, correct: item.options[item.answer] });
    saveMistakes(item, chosen.t);
  }
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = (chosen.right ? "<b>✅ Correct!</b> " : "<b>❌ Incorrect (Saved to Wrong Answers Bank).</b> ") + item.why + `<br><small style="color:#64748b;font-family:monospace;">📌 ${item.docRef}</small>`;
  const last = current === activePool.length - 1;
  document.getElementById("next").innerHTML = `<button class="btn" onclick="${last ? 'finish()' : 'nextQ()'}">${last ? 'See Results' : 'Next Question →'}</button>`;
}
function nextQ() { current++; show(); }
function finish() {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <h1>${TOPIC_META.icon} ${TOPIC_META.title} — Results: ${score} / ${activePool.length}</h1>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="btn" onclick="start(true)">🔄 Retake (Critical First)</button>
      <a class="btn secondary" href="index.html">🏠 Back to Full Hub & Mock Exams</a>
    </div>
    ${sessionMistakes.map(m => `
      <div class="explain" style="display:block;border-left-color:#dc2626;margin-bottom:10px;">
        <b>${m.item.q}</b><br>
        <span style="color:#dc2626;">Your answer:</span> ${m.yours}<br>
        <span style="color:#15803d;">Correct:</span> ${m.correct}<br>
        ${m.item.why}<br>
        <small style="font-family:monospace;color:#64748b;">📖 ${m.item.docRef}</small>
      </div>
    `).join("")}
  `;
}
loadMistakes();
start(true);
</script>
</body>
