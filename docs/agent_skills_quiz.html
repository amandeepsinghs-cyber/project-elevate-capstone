const questions = [{"id": 200, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Self-Test #1 & Trigger #8 | M1L1 Slide 8", "q": "What does an agent load into context at startup for each available Agent Skill?", "options": ["Only each skill's name and description; the full SKILL.md is read only when the agent judges the skill relevant", "The entire SKILL.md file for every installed skill", "All files inside scripts/, examples/, and resources/ up front", "Nothing at all until the user explicitly types a slash command"], "answer": 0, "why": "Agent Skills use progressive disclosure: only each skill's name and description load at startup. The full SKILL.md is read only when the agent judges the skill relevant."}, {"id": 201, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Trigger #8 | M1L1 Slide 6", "q": "Which core problem are Agent Skills and progressive disclosure designed to solve?", "options": ["Tool bloat, where loading hundreds of tools and rules into context makes the agent slower, costlier, and worse at picking the right one", "Network latency between Cloud Run and BigQuery", "Lack of encryption in third-party OAuth tokens", "Container cold starts on GKE Autopilot"], "answer": 0, "why": "Skills solve 'tool bloat'—where loading too many tools and instructions up front overwhelms the context window, increasing latency/cost and degrading tool selection accuracy."}, {"id": 202, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Self-Test #1 & Trigger #8 | M1L1 Slide 11", "q": "Where should a team store a PROJECT-SPECIFIC (workspace) skill so it is version-controlled and shared with the repo?", "options": ["<project-root>/.agents/skills/<skill>/", "~/.gemini/config/skills/<skill>/", "/etc/google/skills/<skill>/", "<project-root>/.well-known/skills/"], "answer": 0, "why": "Project-specific (workspace) skills live at <project-root>/.agents/skills/<skill>/. Watch out for the trap offering ~/.gemini/config/skills/, which is the global path."}, {"id": 203, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Self-Test #1 & Trigger #8 | M1L1 Slide 11", "q": "A developer wants a custom skill to be available globally across all projects in Antigravity, the IDE, and the CLI. Where should they place it?", "options": ["~/.gemini/config/skills/", "<project-root>/.agents/skills/", "~/.config/gcloud/skills/", "/usr/local/share/adk/skills/"], "answer": 0, "why": "Global skills live at ~/.gemini/config/skills/ and work across Antigravity, the IDE, and the CLI."}, {"id": 204, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Trigger #8 | M1L1 Slide 9", "q": "In a skill's required SKILL.md YAML frontmatter, which field is REQUIRED and which is OPTIONAL?", "options": ["description is required; name is optional", "name is required; description is optional", "Both name and version are required; description is optional", "No YAML frontmatter is used in SKILL.md"], "answer": 0, "why": "In SKILL.md YAML frontmatter, 'description' is required (since the agent uses it to judge relevance), and 'name' is optional."}, {"id": 205, "topicId": "agent_skills", "topic": "Agent Skills Standard", "module": "M1", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.1 Agent Skills | Trigger #8 | M1L1 Slide 9", "q": "Besides the required SKILL.md file, what optional subdirectories can an Agent Skill folder contain?", "options": ["scripts/, examples/, and resou const STORAGE_KEY = "project_elevate_unified_mistakes_v1";
const LOCAL_API_URL = "http://127.0.0.1:8765/api/mistakes";

let activePool = [];
let current = 0;
let score = 0;
let criticalFirst = true;
let sessionMistakes = [];
let mistakesMap = {};

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) mistakesMap = JSON.parse(raw);
  } catch (e) {}
}
function saveMistakes(item, wrongChoice) {
  loadMistakes();
  const ex = mistakesMap[item.id];
  mistakesMap[item.id] = {
    ...item,
    yours: wrongChoice,
    correct: item.options[item.answer],
    missCount: ex ? (ex.missCount || 1) + 1 : 1,
    lastMissed: new Date().toLocaleDateString()
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakesMap)); } catch (e) {}
  fetch(LOCAL_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), questions: Object.values(mistakesMap) })
  }).catch(() => {});
}
function shuffle(a) {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function renderNav() {
  return `<div class="topic-nav">
    <a class="topic-link hub" href="index.html">🏠 Hub & Mock Exams</a>
    ${ALL_TOPICS.map(t => `<a class="topic-link ${t.id === TOPIC_META.id ? 'active' : ''}" href="${t.quizFile}">${t.icon} ${t.shortTitle}</a>`).join("")}
  </div>`;
}
function start(orderCrit = true) {
  criticalFirst = orderCrit;
  const crit = shuffle(questions.filter(q => q.priority === "CRITICAL"));
  const high = shuffle(questions.filter(q => q.priority !== "CRITICAL"));
  activePool = criticalFirst ? [...crit, ...high] : shuffle(questions);
  current = 0; score = 0; sessionMistakes = [];
  show();
}
function show() {
  const item = activePool[current];
  const opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <div class="header-row">
      <h1>${TOPIC_META.icon} ${TOPIC_META.title} (10 Questions)</h1>
      <div>
        ${TOPIC_META.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL TOPIC</span>' : '<span class="badge badge-high">⚡ HIGH VALUE TOPIC</span>'}
        <span class="badge badge-mod">${TOPIC_META.examWeight}</span>
      </div>
    </div>
    <div class="doc-ref">📖 <b>Doc Reference:</b> ${item.docRef}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#475569;">
      <span>Question <b>${current + 1} of ${activePool.length}</b> &nbsp;|&nbsp; Score: <b>${score}</b></span>
      <div>
        ${item.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL — Practice First</span>' : '<span class="badge badge-high">⚡ HIGH VALUE</span>'}
        <button class="btn secondary" style="margin:0 0 0 8px;padding:4px 10px;font-size:12px;" onclick="start(${!criticalFirst})">
          ${criticalFirst ? "🔀 Shuffle All" : "🔥 Order Critical First"}
        </button>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${((current + 1) / activePool.length) * 100}%"></div></div>
    <div class="q">${item.q}</div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div id="next"></div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => pick(b, o, opts, item);
    box.appendChild(b);
  });
}
function pick(btn, chosen, opts, item) {
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].right) b.classList.add("correct");
  });
  if (chosen.right) {
    score++;
  } else {
    btn.classList.add("wrong");
    sessionMistakes.push({ item, yours: chosen.t, correct: item.options[item.answer] });
    saveMistakes(item, chosen.t);
  }
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = (chosen.right ? "<b>✅ Correct!</b> " : "<b>❌ Incorrect (Saved to Wrong Answers Bank).</b> ") + item.why + `<br><small style="color:#64748b;font-family:monospace;">📌 ${item.docRef}</small>`;
  const last = current === activePool.length - 1;
  document.getElementById("next").innerHTML = `<button class="btn" onclick="${last ? 'finish()' : 'nextQ()'}">${last ? 'See Results' : 'Next Question →'}</button>`;
}
function nextQ() { current++; show(); }
function finish() {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <h1>${TOPIC_META.icon} ${TOPIC_META.title} — Results: ${score} / ${activePool.length}</h1>
    <p>${score >= 9 ? "✅ Passed (≥90%)! Ready for the next topic." : "⚠️ Below 9/10 pass bar. Review the missed questions below and retake."}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="btn" onclick="start(true)">🔄 Retake (Critical First)</button>
      <a class="btn secondary" href="index.html">🏠 Back to Full Hub & Mock Exams</a>
    </div>
    ${sessionMistakes.map(m => `
      <div class="explain" style="display:block;border-left-color:#dc2626;margin-bottom:10px;">
        <b>${m.item.q}</b><br>
        <span style="color:#dc2626;">Your answer:</span> ${m.yours}<br>
        <span style="color:#15803d;">Correct:</span> ${m.correct}<br>
        ${m.item.why}<br>
        <small style="font-family:monospace;color:#64748b;">📖 ${m.item.docRef}</small>
      </div>
    `).join("")}
  `;
}
loadMistakes();
start(true);
</script>
