const questions = [{"id": 300, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Trigger #15 | M2S2 Slide 24", "q": "What type of cryptographic identity does Google Cloud Agent Identity assign to each agent?", "options": ["A dedicated SPIFFE-based identity with an X.509 certificate that is not shared and cannot be impersonated", "A shared default Compute Engine service account JSON key", "A static API key stored in an environment variable", "A browser session cookie shared across all agents in the project"], "answer": 0, "why": "Each agent gets its own SPIFFE-based identity with an X.509 certificate assigned by Google Cloud. It is not shared and cannot be impersonated."}, {"id": 301, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Self-Test #4 & Trigger #15 | M2S2 Slide 25", "q": "When an agent queries a Google Cloud resource like BigQuery, which identity does it use?", "options": ["The agent's own SPIFFE identity, governed by Google Cloud IAM", "A 3-legged OAuth token issued by an external SaaS server", "Its logical Agent Registry Identifier (urn:agent:...)", "Agents never hold their own credential and must use an anonymous key"], "answer": 0, "why": "For Google Cloud resources (like BigQuery), the agent uses its own SPIFFE identity governed by IAM. Watch out for the wrong option claiming 'an agent never holds its own credential.'"}, {"id": 302, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Self-Test #4 & Trigger #15 | M2S2 Slide 26", "q": "An agent needs to create a Jira ticket in a third-party SaaS app on the user's behalf. How does it authenticate?", "options": ["User-delegated 3-legged OAuth through the Agent Identity auth manager", "The agent's own Google Cloud IAM service account", "Hardcoding the user's credentials in the system prompt", "Using an IAM deny policy on the BigQuery API"], "answer": 0, "why": "When calling a third-party SaaS app on the user's behalf, the agent uses user-delegated 3-legged OAuth through the Agent Identity auth manager."}, {"id": 303, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Trigger #15 | M2S2 Slide 26", "q": "When an agent uses 3-legged OAuth via the Agent Identity auth manager to call a third-party SaaS API, who issues the access token?", "options": ["The third-party SaaS OAuth server", "Google Cloud IAM", "Model Armor", "BigQuery"], "answer": 0, "why": "In user-delegated 3-legged OAuth for a third-party SaaS app, the token is issued by the SaaS OAuth server and managed by the Agent Identity auth manager."}, {"id": 304, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Self-Test #4 & Trigger #15 | M2S2 Slides 25–26", "q": "In one workflow, an agent reads data from BigQuery and then updates a ticket in ServiceNow on the user's behalf. Which credentials does it use?", "options": ["Its own SPIFFE identity (IAM) for BigQuery, and user-delegated 3-legged OAuth for ServiceNow", "One combined credential that authenticates to both BigQuery and ServiceNow", "User-delegated 3-legged OAuth for both BigQuery and ServiceNow", "Its SPIFFE identity for ServiceNow, and 3-legged OAuth for BigQuery"], "answer": 0, "why": "Classic §1.5 scenario: the agent uses its own SPIFFE identity (governed by IAM) for GCP resources like BigQuery, and user-delegated 3-legged OAuth for third-party SaaS apps."}, {"id": 305, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Trigger #15 | M2S2 Slide 28", "q": "Which traffic directions does Google Cloud Agent Gateway govern?", "options": ["Both ingress (inbound to the agent) and egress (outbound from the agent to tools and other agents)", "Egress traffic only", "Ingress traffic only", "Neither; Agent Gateway only handles token billing"], "answer": 0, "why": "Agent Gateway governs both ingress and egress traffic and enforces access policies. Watch out for traps saying it 'only handles egress' or 'only billing.'"}, {"id": 306, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "CRITICAL", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Trigger #15 | M2S2 Slide 28", "q": "A security team configures Agent Gateway with Model Armor to inspect an agent's tool calls and responses. What application code changes are required?", "options": ["No application code changes are needed", "Every tool function must be rewritten to call the Model Armor REST API manually", "The agent must be migrated from Python to Go", "Every prompt must be manually encrypted inside the agent code"], "answer": 0, "why": "Agent Gateway is a fully managed component that governs ingress/egress traffic, enforces access policies, and integrates with Model Armor to inspect tool calls and responses with no app code changes needed."}, {"id": 307, "topicId": "agent_identity", "topic": "Agent Identity & Agent Gateway", "module": "M2", "priority": "HIGH_VALUE", "docRef": "Elevate Capstone Prep (Oct 7-8).md — §1.5 Agent Identity & Gateway | Trigger #15 | M2S2 Slides 24–29", "q": "Which statement accurately describes the relationship between Agent Gateway and Agent Identity?", "options": ["Agent Gateway works alongside and requires Agent Identity; it does const STORAGE_KEY = "project_elevate_unified_mistakes_v1";
const LOCAL_API_URL = "http://127.0.0.1:8765/api/mistakes";

let activePool = [];
let current = 0;
let score = 0;
let criticalFirst = true;
let sessionMistakes = [];
let mistakesMap = {};

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) mistakesMap = JSON.parse(raw);
  } catch (e) {}
}
function saveMistakes(item, wrongChoice) {
  loadMistakes();
  const ex = mistakesMap[item.id];
  mistakesMap[item.id] = {
    ...item,
    yours: wrongChoice,
    correct: item.options[item.answer],
    missCount: ex ? (ex.missCount || 1) + 1 : 1,
    lastMissed: new Date().toLocaleDateString()
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakesMap)); } catch (e) {}
  fetch(LOCAL_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), questions: Object.values(mistakesMap) })
  }).catch(() => {});
}
function shuffle(a) {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function renderNav() {
  return `<div class="topic-nav">
    <a class="topic-link hub" href="index.html">🏠 Hub & Mock Exams</a>
    ${ALL_TOPICS.map(t => `<a class="topic-link ${t.id === TOPIC_META.id ? 'active' : ''}" href="${t.quizFile}">${t.icon} ${t.shortTitle}</a>`).join("")}
  </div>`;
}
function start(orderCrit = true) {
  criticalFirst = orderCrit;
  const crit = shuffle(questions.filter(q => q.priority === "CRITICAL"));
  const high = shuffle(questions.filter(q => q.priority !== "CRITICAL"));
  activePool = criticalFirst ? [...crit, ...high] : shuffle(questions);
  current = 0; score = 0; sessionMistakes = [];
  show();
}
function show() {
  const item = activePool[current];
  const opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <div class="header-row">
      <h1>${TOPIC_META.icon} ${TOPIC_META.title} (10 Questions)</h1>
      <div>
        ${TOPIC_META.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL TOPIC</span>' : '<span class="badge badge-high">⚡ HIGH VALUE TOPIC</span>'}
        <span class="badge badge-mod">${TOPIC_META.examWeight}</span>
      </div>
    </div>
    <div class="doc-ref">📖 <b>Doc Reference:</b> ${item.docRef}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#475569;">
      <span>Question <b>${current + 1} of ${activePool.length}</b> &nbsp;|&nbsp; Score: <b>${score}</b></span>
      <div>
        ${item.priority === 'CRITICAL' ? '<span class="badge badge-critical">🔥 CRITICAL — Practice First</span>' : '<span class="badge badge-high">⚡ HIGH VALUE</span>'}
        <button class="btn secondary" style="margin:0 0 0 8px;padding:4px 10px;font-size:12px;" onclick="start(${!criticalFirst})">
          ${criticalFirst ? "🔀 Shuffle All" : "🔥 Order Critical First"}
        </button>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${((current + 1) / activePool.length) * 100}%"></div></div>
    <div class="q">${item.q}</div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div id="next"></div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => pick(b, o, opts, item);
    box.appendChild(b);
  });
}
function pick(btn, chosen, opts, item) {
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].right) b.classList.add("correct");
  });
  if (chosen.right) {
    score++;
  } else {
    btn.classList.add("wrong");
    sessionMistakes.push({ item, yours: chosen.t, correct: item.options[item.answer] });
    saveMistakes(item, chosen.t);
  }
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = (chosen.right ? "<b>✅ Correct!</b> " : "<b>❌ Incorrect (Saved to Wrong Answers Bank).</b> ") + item.why + `<br><small style="color:#64748b;font-family:monospace;">📌 ${item.docRef}</small>`;
  const last = current === activePool.length - 1;
  document.getElementById("next").innerHTML = `<button class="btn" onclick="${last ? 'finish()' : 'nextQ()'}">${last ? 'See Results' : 'Next Question →'}</button>`;
}
function nextQ() { current++; show(); }
function finish() {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderNav()}
    <h1>${TOPIC_META.icon} ${TOPIC_META.title} — Results: ${score} / ${activePool.length}</h1>
    <p>${score >= 9 ? "✅ Passed (≥90%)! Ready for the next topic." : "⚠️ Below 9/10 pass bar. Review the missed questions below and retake."}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="btn" onclick="start(true)">🔄 Retake (Critical First)</button>
      <a class="btn secondary" href="index.html">🏠 Back to Full Hub & Mock Exams</a>
    </div>
    ${sessionMistakes.map(m => `
      <div class="explain" style="display:block;border-left-color:#dc2626;margin-bottom:10px;">
        <b>${m.item.q}</b><br>
        <span style="color:#dc2626;">Your answer:</span> ${m.yours}<br>
        <span style="color:#15803d;">Correct:</span> ${m.correct}<br>
        ${m.item.why}<br>
        <small style="font-family:monospace;color:#64748b;">📖 ${m.item.docRef}</small>
      </div>
    `).join("")}
  `;
}
loadMistakes();
start(true);
</script>
